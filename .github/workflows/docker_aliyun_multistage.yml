name: HIE_GLOMAP Multistage Build & Push to Aliyun ACR
run-name: ${{ github.actor }} build multistage hie_glomap runtime image
on:
  push:
    branches:
      - dev
    paths:
      - 'Dockerfile'
      - '.github/workflows/docker_aliyun_multistage.yml'
  workflow_dispatch:

jobs:
  build-test:
    name: Multistage Build & Push Ubuntu20.04 CUDA11.8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push multi-stage runtime image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/hie_glomap:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Clean up docker resource
        if: always()
        run: |
          docker system prune -f

      - name: Build Success Notify
        if: success()
        run: echo "✅ HIE_GLOMAP CUDA11.8轻量化运行时镜像构建推送阿里云ACR完成"
